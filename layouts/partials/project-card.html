<article class="project-card">
  <a href="{{ .RelPermalink }}" class="project-link">
    <div class="project-image{{ if not .Params.image }} project-placeholder{{ end }}">
      {{ with .Resources.GetMatch (.Params.image | default "") }}<img src="{{ .RelPermalink }}" alt="{{ $.Params.imageAlt | default $.Title }}" loading="lazy">{{ else if .Params.image }}<img src="{{ .Params.image | relURL }}" alt="{{ .Params.imageAlt | default .Title }}" loading="lazy">{{ else }}<span aria-hidden="true">✳</span>{{ end }}
      <span class="project-arrow" aria-hidden="true">↗</span>
    </div>
    <div class="project-meta"><div><h3>{{ .Title }}</h3>{{ with .Params.subtitle }}<p>{{ . }}</p>{{ end }}</div>{{ with .Params.year }}<span>{{ . }}</span>{{ end }}</div>
  </a>
</article>
