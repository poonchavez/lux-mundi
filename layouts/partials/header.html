<header class="site-header">
  <a class="wordmark" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Title }} home">
    <span class="wordmark-mark" aria-hidden="true">✳</span><span>{{ site.Title }}</span>
  </a>
  <nav aria-label="Main navigation">
    {{ range site.Menus.main }}<a href="{{ .URL | relURL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>{{ end }}
  </nav>
</header>
